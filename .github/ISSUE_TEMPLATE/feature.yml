name: Feature
description: Something new for the site or admin
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [site, booking, admin, data, infra]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What should exist, and who is it for?
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist that tells us it's finished.
      value: |
        - [ ] 
